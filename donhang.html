<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Đơn Hàng - Mê Đá</title>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #FBF6EE; --card-bg: #FFFDF9; --primary: #3D2B1F; --accent: #C85A32; --border: #E8DFC8; --green: #2E7D32; --amber: #EF6C00; --zalo: #0068FF; --red: #C62828; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg-color); color: #2B1E16; }
        
        header { background-color: var(--primary); color: #FAF4EB; padding: 1.2rem 2rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        header h1 { font-family: 'Merriweather', serif; font-size: 1.5rem; }
        .btn-header { background: rgba(255,255,255,0.15); color: white; border: 1px solid rgba(255,255,255,0.3); padding: 6px 14px; border-radius: 6px; cursor: pointer; text-decoration: none; font-weight: 600;}
        .btn-header:hover { background: rgba(255,255,255,0.3); }
        
        .main-content { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; }
        .orders-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem; }
        .order-card { background: var(--card-bg); border: 2px solid var(--border); border-radius: 12px; padding: 1.5rem; box-shadow: 0 4px 15px rgba(0,0,0,0.05); display: flex; flex-direction: column; animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .order-card.done { opacity: 0.6; border-style: dashed; }
        
        .order-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px dashed var(--border); padding-bottom: 10px; margin-bottom: 10px; }
        .queue-number { font-size: 1.8rem; font-weight: 900; color: var(--accent); font-family: 'Merriweather', serif; }
        .customer-name { font-size: 1.1rem; font-weight: 700; color: var(--primary); }
        .order-type { font-size: 0.8rem; padding: 4px 8px; border-radius: 12px; font-weight: bold; }
        .type-dinein { background: #E8F5E9; color: var(--green); }
        .type-takeaway { background: #FFF3E0; color: var(--amber); }

        .order-items { flex-grow: 1; margin-bottom: 15px; font-size: 0.95rem; }
        .order-item { display: flex; justify-content: space-between; margin-bottom: 5px; font-weight: 600; border-bottom: 1px solid #f0e6d6; padding-bottom: 4px;}
        .order-footer { text-align: center; margin-top: auto; }
        .btn-done { width: 100%; padding: 10px; background-color: var(--green); color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 1rem; transition: 0.2s;}
        .btn-done:hover { background-color: #1b5e20; }
        .time-text { font-size: 0.8rem; color: #888; margin-bottom: 8px; display: block; }

        #loginOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(61, 43, 31, 0.85); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .login-box { background: var(--card-bg); padding: 2.5rem; border-radius: 12px; width: 360px; text-align: center; box-shadow: 0 8px 25px rgba(0,0,0,0.2); border: 2px solid var(--border); }
        .login-box h2 { font-family: 'Merriweather', serif; color: var(--primary); margin-bottom: 1.5rem; }
        .login-box input { width: 100%; padding: 10px; margin-bottom: 1rem; border: 1px solid var(--border); border-radius: 6px; font-family: inherit;}
        .login-box button { width: 100%; padding: 12px; background: var(--accent); color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 1rem;}
        .forgot-pass-link { display: block; text-align: right; font-size: 0.85rem; color: var(--accent); margin-top: -10px; margin-bottom: 15px; font-weight: 600; text-decoration: none; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 999; }
        .modal-content { background: #fff; padding: 2rem; border-radius: 8px; width: 400px; max-width: 90%; }
        .modal-header { font-family: 'Merriweather', serif; font-size: 1.2rem; color: var(--primary); margin-bottom: 1rem; text-align: left;}
        .input-group { margin-bottom: 1rem; text-align: left; }
        .input-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 4px; }
        .input-group input { width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; font-family: inherit; }
        .btn { padding: 6px 12px; border: none; border-radius: 4px; font-weight: 600; cursor: pointer; color: white; font-size: 0.85rem;}
        .btn-accent { background: var(--accent); }
    </style>
</head>
<body>

    <!-- Đăng nhập Nhân Viên -->
    <div id="loginOverlay">
        <div class="login-box">
            <h2>Đăng Nhập</h2>
            <input type="text" id="staffUser" placeholder="Tên đăng nhập">
            <input type="password" id="staffPass" placeholder="Mật khẩu">
            <a href="#" class="forgot-pass-link" onclick="window.openForgotModal()">Quên mật khẩu?</a>
            <button onclick="window.loginStaff()">Vào Trang Bếp</button>
            <a href="index.html" style="display: block; margin-top: 15px; font-size: 0.85rem; color: #7A6B62;">⬅ Quay về trang đặt món</a>
        </div>
    </div>

    <!-- Modal Quên Mật Khẩu -->
    <div id="modalForgot" class="modal" style="z-index: 1001;">
        <div class="modal-content">
            <div class="modal-header">Khôi Phục Mật Khẩu Nhân Viên</div>
            <div class="input-group">
                <label>Tên đăng nhập</label>
                <input type="text" id="fgUser" placeholder="Nhập tên đăng nhập">
            </div>
            <div class="input-group">
                <label>Mã khôi phục</label>
                <input type="text" id="fgCode" placeholder="Mặc định là: meda">
            </div>
            <div class="input-group">
                <label>Mật khẩu mới</label>
                <input type="password" id="fgNewPass" placeholder="Nhập mật khẩu mới">
            </div>
            <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 1.5rem;">
                <button class="btn" style="background:#ccc; color:#000;" onclick="window.closeModals()">Hủy</button>
                <button class="btn btn-accent" onclick="window.processResetPassword()">Đổi mật khẩu</button>
            </div>
        </div>
    </div>

    <header>
        <h1>👨‍🍳 Quầy Pha Chế <span style="font-size: 0.8rem; background: var(--green); padding: 2px 6px; border-radius: 8px;">LIVE</span></h1>
        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
            <button class="btn-header" style="background: var(--red); border-color: var(--red);" onclick="window.staffPushZaloAlert()">⚠️ Báo Hết NL / Chốt Ca Về Zalo</button>
            <a href="index.html" class="btn-header" style="background: var(--zalo); border-color: var(--zalo);">🛒 Trang Đặt Hàng</a>
            <button class="btn-header" onclick="window.logoutStaff()">Đăng Xuất</button>
        </div>
    </header>

    <div class="main-content">
        <h2 style="margin-bottom: 1rem; color: var(--primary); font-family: 'Merriweather', serif;">Đơn Hàng Chờ Xử Lý</h2>
        <div id="pendingOrdersContainer" class="orders-grid"></div>

        <h2 style="margin-top: 3rem; margin-bottom: 1rem; color: #7A6B62; font-family: 'Merriweather', serif;">Đơn Hàng Đã Pha Xong (50 đơn gần nhất)</h2>
        <div id="completedOrdersContainer" class="orders-grid"></div>
    </div>

    <!-- TÍCH HỢP FIREBASE REALTIME & NÚT BÁO ZALO NHANH TỪ BẾP -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
        import { getFirestore, collection, query, orderBy, onSnapshot, getDocs, doc, getDoc, updateDoc, limit } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAtZN8CGdH0M-OTs9Z2gGCsiA2AWJ0WRXg",
            authDomain: "meda-e0955.firebaseapp.com",
            projectId: "meda-e0955",
            storageBucket: "meda-e0955.firebasestorage.app",
            messagingSenderId: "446317572827",
            appId: "1:446317572827:web:bdad243a1e5ba1ceba12fe",
            measurementId: "G-8FVX96XD07"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        if (sessionStorage.getItem('meda_staff_logged_in') === 'true') {
            document.getElementById('loginOverlay').style.display = 'none';
            startListeningOrders();
        }

        window.loginStaff = function() {
            const currentPass = localStorage.getItem('meda_staff_pass') || '123456';
            if (document.getElementById('staffUser').value === 'nhanvien' && document.getElementById('staffPass').value === currentPass) {
                sessionStorage.setItem('meda_staff_logged_in', 'true');
                document.getElementById('loginOverlay').style.display = 'none';
                startListeningOrders();
            } else { alert("Sai tài khoản hoặc mật khẩu!"); }
        }

        window.logoutStaff = function() { sessionStorage.removeItem('meda_staff_logged_in'); window.location.reload(); }
        window.openForgotModal = function() { document.getElementById('modalForgot').style.display = 'flex'; }
        window.closeModals = function() { document.querySelectorAll('.modal').forEach(m => m.style.display = 'none'); }
        
        window.processResetPassword = function() {
            const user = document.getElementById('fgUser').value;
            const code = document.getElementById('fgCode').value;
            const newPass = document.getElementById('fgNewPass').value;
            
            if (user === 'nhanvien' && code === 'medacoffee') {
                if (newPass.length < 6) return alert("Mật khẩu mới phải có ít nhất 6 ký tự!");
                localStorage.setItem('meda_staff_pass', newPass);
                alert("Đổi mật khẩu thành công! Vui lòng đăng nhập lại.");
                window.closeModals();
                document.getElementById('staffPass').value = '';
            } else { alert("Tên đăng nhập hoặc Mã khôi phục không chính xác!"); }
        }

        function startListeningOrders() {
            const q = query(collection(db, "orders"), orderBy("timestamp", "desc"), limit(50));
            onSnapshot(q, (snapshot) => {
                const pendingContainer = document.getElementById('pendingOrdersContainer');
                const completedContainer = document.getElementById('completedOrdersContainer');
                pendingContainer.innerHTML = ''; completedContainer.innerHTML = '';

                let hasPending = false; let hasCompleted = false;

                snapshot.forEach(docSnap => {
                    const order = docSnap.data();
                    const dbId = docSnap.id;
                    const isDone = order.status === 'Hoàn thành';
                    const typeClass = order.orderType === 'Tại chỗ' ? 'type-dinein' : 'type-takeaway';
                    
                    let itemsHtml = '';
                    order.items.forEach(item => {
                        itemsHtml += `<div class="order-item"><span>${item.name}</span> <span style="color:var(--accent);">x${item.quantity}</span></div>`;
                    });

                    const cardHtml = `
                        <div class="order-card ${isDone ? 'done' : ''}">
                            <div class="order-header">
                                <div><span class="customer-name">👤 ${order.customerName}</span><br><span class="order-type ${typeClass}">${order.orderType}</span></div>
                                <div class="queue-number">#${order.queueNumber}</div>
                            </div>
                            <div class="order-items">${itemsHtml}</div>
                            <div class="order-footer">
                                <span class="time-text">🕒 Đặt lúc: ${order.createdAt}</span>
                                ${!isDone ? `<button class="btn-done" onclick="window.markAsDone('${dbId}')">✔ Đã Pha Chế Xong</button>` : `<strong style="color: var(--green);">Đã Gọi Khách</strong>`}
                            </div>
                        </div>
                    `;

                    if (!isDone) { pendingContainer.innerHTML += cardHtml; hasPending = true; } 
                    else { completedContainer.innerHTML += cardHtml; hasCompleted = true; }
                });

                if (!hasPending) pendingContainer.innerHTML = '<p style="color:#888; font-style:italic;">Tuyệt vời! Hiện không có đơn hàng nào đang chờ.</p>';
                if (!hasCompleted) completedContainer.innerHTML = '<p style="color:#888; font-style:italic;">Chưa có đơn nào hoàn thành.</p>';
            });
        }

        window.markAsDone = async function(dbId) {
            try {
                await updateDoc(doc(db, "orders", dbId), { status: "Hoàn thành" });
            } catch(e) { alert("Lỗi khi cập nhật trạng thái đơn!"); }
        }

        // Nút cho nhân viên bếp đẩy nhanh báo cáo Hết nguyên liệu / Hết món / Doanh thu ca về Zalo chủ quán
        window.staffPushZaloAlert = async function() {
            try {
                const [zaloSnap, invSnap, prodSnap, ordersSnap] = await Promise.all([
                    getDoc(doc(db, "config", "zalo")),
                    getDocs(collection(db, "inventory")),
                    getDocs(collection(db, "products")),
                    getDocs(collection(db, "orders"))
                ]);

                const inventory = invSnap.docs.map(d => d.data());
                const products = prodSnap.docs.map(d => ({ ...d.data(), id: d.id }));
                const allOrders = ordersSnap.docs.map(d => d.data());

                const outIngs = inventory.filter(i => i.quantity <= 0).map(i => `- ❌ ${i.name}: HẾT SẠCH (0 ${i.unit})`);
                const lowIngs = inventory.filter(i => i.quantity > 0 && i.quantity <= 50).map(i => `- ⚠️ ${i.name}: Sắp hết (${i.quantity} ${i.unit})`);

                const outProds = [];
                products.forEach(p => {
                    let maxCups = Infinity;
                    if (!p.recipe || p.recipe.length === 0) maxCups = 999;
                    else {
                        p.recipe.forEach(ri => {
                            const inv = inventory.find(i => i.id === ri.ingId);
                            if (!inv || inv.quantity < ri.amount) maxCups = 0;
                            else maxCups = Math.min(maxCups, Math.floor(inv.quantity / ri.amount));
                        });
                    }
                    if (maxCups === 0 || maxCups === Infinity) outProds.push(`- 🚫 ${p.name}: HẾT MÓN (0 ly)`);
                });

                const now = new Date();
                const todayStr = `${now.getDate().toString().padStart(2, '0')}/${(now.getMonth() + 1).toString().padStart(2, '0')}/${now.getFullYear()}`;
                const todayOrders = allOrders.filter(o => o.createdAt && o.createdAt.includes(todayStr));

                let dailyRev = 0; let dailyCups = 0;
                const soldMap = {};
                todayOrders.forEach(o => {
                    dailyRev += (o.total || 0);
                    if (o.items && Array.isArray(o.items)) {
                        o.items.forEach(it => {
                            const k = it.id || it.name;
                            if (!soldMap[k]) soldMap[k] = { name: it.name, qty: 0, rev: 0 };
                            soldMap[k].qty += it.quantity;
                            soldMap[k].rev += (it.price * it.quantity);
                            dailyCups += it.quantity;
                        });
                    }
                });

                const soldLines = Object.values(soldMap).map(s => `• ${s.name}: ${s.qty} ly (${s.rev.toLocaleString('vi-VN')}đ)`).join('\n') || '- Chưa bán ly nào';

                const msg = [
                    `👨‍🍳 [QUẦY BẾP MÊ ĐÁ] BÁO CÁO KHO & CHỐT CA (${todayStr})`,
                    `🕒 Lúc: ${now.toLocaleTimeString('vi-VN')}`,
                    `========================`,
                    `⚠️ 1. NGUYÊN LIỆU & MÓN HẾT:`,
                    ...(outIngs.length || lowIngs.length || outProds.length ? [...outIngs, ...lowIngs, ...outProds] : [`✅ Nguyên liệu & các món đều còn đủ.`]),
                    `========================`,
                    `💰 2. DOANH THU & MÓN BÁN TRONG NGÀY:`,
                    `• Tổng thu hôm nay: ${dailyRev.toLocaleString('vi-VN')} VNĐ (${todayOrders.length} đơn - ${dailyCups} ly)`,
                    `• Chi tiết các món đã bán:\n${soldLines}`
                ].join('\n');

                navigator.clipboard.writeText(msg).catch(() => {});

                const zaloCfg = zaloSnap.exists() ? zaloSnap.data() : null;
                if (zaloCfg && (zaloCfg.mode === 'zalo_bot' || !zaloCfg.mode) && zaloCfg.botToken && zaloCfg.botChatId) {
                    const targetUrl = `https://bot-api.zapps.me/bot${zaloCfg.botToken}/sendMessage`;
                    const formBody = new URLSearchParams();
                    formBody.append('chat_id', zaloCfg.botChatId);
                    formBody.append('text', msg);
                    await fetch(targetUrl, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: formBody.toString()
                    });
                    alert("✅ Đã đẩy báo cáo từ Quầy Bếp về Bot MÊ ĐÁ Assistant trên Zalo!");
                } else if (zaloCfg && zaloCfg.mode === 'webhook' && zaloCfg.webhookUrl) {
                    await fetch(zaloCfg.webhookUrl, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ shop: "Mê Đá", type: "kitchen_report", message: msg, text: msg })
                    });
                    alert("✅ Đã đẩy báo cáo từ Quầy Bếp về Zalo thành công!");
                } else {
                    alert("📋 Đã sao chép báo cáo Quầy Bếp vào bộ nhớ tạm! Bạn có thể dán gửi ngay qua Zalo.");
                }
            } catch (e) {
                alert("Lỗi khi tạo báo cáo Zalo từ Quầy Bếp!");
            }
        }
    </script>
</body>
</html>
