<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh Toán Đơn Hàng - Mê Đá</title>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #FBF6EE; --card-bg: #FFFDF9; --primary: #3D2B1F; --accent: #C85A32; --border: #E8DFC8; --green: #2E7D32; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg-color); color: #2B1E16; padding: 2rem 1rem; }
        .checkout-card { max-width: 520px; margin: 0 auto; background: var(--card-bg); border: 2px solid var(--border); border-radius: 16px; padding: 2rem; box-shadow: 0 10px 25px rgba(61,43,31,0.08); text-align: center; }
        h2 { font-family: 'Merriweather', serif; color: var(--primary); margin-bottom: 0.5rem; }
        .order-id { font-size: 0.9rem; color: #7A6B62; margin-bottom: 1.5rem; }
        .qr-container { background: white; padding: 1rem; border-radius: 12px; display: inline-block; border: 1px solid var(--border); margin-bottom: 1.5rem; }
        .qr-image { width: 260px; height: 260px; object-fit: contain; }
        .payment-info { background-color: #FAF5ED; border-radius: 8px; padding: 1rem; text-align: left; margin-bottom: 1.5rem; font-size: 0.95rem; }
        .info-row { display: flex; justify-content: space-between; margin-bottom: 0.5rem; }
        .btn-confirm { width: 100%; padding: 14px; background-color: var(--green); color: white; border: none; border-radius: 8px; font-size: 1.05rem; font-weight: 700; cursor: pointer; margin-bottom: 10px; transition: 0.3s; }
        .btn-confirm:disabled { background-color: #888; cursor: not-allowed; }
        .btn-cancel { background: none; border: none; color: #7A6B62; cursor: pointer; text-decoration: underline; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="checkout-card">
        <h2>MÊ ĐÁ</h2>
        <div class="order-id" id="orderIdText">Mã đơn hàng: Loading...</div>
        <p style="margin-bottom: 1rem; font-weight: 600;">Mở ứng dụng Ngân hàng / Quét mã VietQR để thanh toán</p>
        <div class="qr-container"><img id="qrImage" class="qr-image" src="" alt="Mã QR Thanh Toán"></div>

        <div class="payment-info">
            <div class="info-row"><span>Khách hàng:</span> <strong id="custNameDisplay" style="color: var(--primary);"></strong></div>
            <div class="info-row"><span>Hình thức:</span> <strong id="orderTypeDisplay"></strong></div>
            <hr style="border: 0; border-top: 1px dashed var(--border); margin: 8px 0;">
            <div class="info-row"><span>Ngân hàng:</span> <strong id="bankName">Loading...</strong></div>
            <div class="info-row"><span>Số tài khoản:</span> <strong id="bankAcc">Loading...</strong></div>
            <div class="info-row"><span>Chủ tài khoản:</span> <strong id="bankHolder">Loading...</strong></div>
            <div class="info-row"><span>Số tiền:</span> <strong id="payAmount" style="color: var(--accent); font-size: 1.1rem;">0 VNĐ</strong></div>
        </div>

        <button id="btnConfirmPayment" class="btn-confirm" onclick="window.confirmPayment()">Kiểm tra thanh toán</button>
        <button class="btn-cancel" onclick="window.cancelOrder()">Chỉnh sửa đơn hàng</button>
    </div>

    <!-- TÍCH HỢP FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
        import { getFirestore, collection, addDoc, doc, getDoc, setDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAtZN8CGdH0M-OTs9Z2gGCsiA2AWJ0WRXg",
            authDomain: "meda-e0955.firebaseapp.com",
            projectId: "meda-e0955",
            storageBucket: "meda-e0955.firebasestorage.app",
            messagingSenderId: "446317572827",
            appId: "1:446317572827:web:bdad243a1e5ba1ceba12fe",
            measurementId: "G-8FVX96XD07"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const pendingOrder = JSON.parse(localStorage.getItem('meda_pending_order'));
        if (!pendingOrder) {
            alert("Không tìm thấy đơn hàng!");
            window.location.href = "index.html";
        }

        async function loadConfig() {
            let bankConfig = { bankId: 'MB', accountNo: '0987654321', accountName: 'QUAN CA PHE ME DA' };
            let customQR = null;

            try {
                const bankSnap = await getDoc(doc(db, "config", "bank"));
                if (bankSnap.exists()) {
                    bankConfig = bankSnap.data();
                    customQR = bankConfig.customQR || null;
                }
            } catch(e) { console.log(e); }

            document.getElementById('orderIdText').textContent = `Mã đơn hàng: #${pendingOrder.orderId}`;
            document.getElementById('custNameDisplay').textContent = pendingOrder.customerName || 'Khách hàng';
            document.getElementById('orderTypeDisplay').textContent = pendingOrder.orderType || 'Tại chỗ';
            document.getElementById('payAmount').textContent = pendingOrder.total.toLocaleString('vi-VN') + ' VNĐ';
            document.getElementById('bankName').textContent = bankConfig.bankId;
            document.getElementById('bankAcc').textContent = bankConfig.accountNo;
            document.getElementById('bankHolder').textContent = bankConfig.accountName;

            if (customQR) {
                document.getElementById('qrImage').src = customQR;
            } else {
                const qrUrl = `https://img.vietqr.io/image/${bankConfig.bankId}-${bankConfig.accountNo}-compact2.png?amount=${pendingOrder.total}&addInfo=${pendingOrder.orderId}&accountName=${encodeURIComponent(bankConfig.accountName)}`;
                document.getElementById('qrImage').src = qrUrl;
            }
        }
        loadConfig();

        window.confirmPayment = async function() {
            const btn = document.getElementById('btnConfirmPayment');
            btn.disabled = true;
            btn.textContent = "⏳ Đang kết nối lên Đám mây...";

            try {
                // 1. Lấy cấp số thứ tự
                const counterRef = doc(db, 'system', 'counter');
                let counterSnap = await getDoc(counterRef);
                let queue = 1;
                if (counterSnap.exists()) {
                    queue = counterSnap.data().lastQueue + 1;
                    if (queue > 99) queue = 1;
                    await updateDoc(counterRef, { lastQueue: queue });
                } else {
                    await setDoc(counterRef, { lastQueue: 1 });
                }

                // 2. Trừ kho nguyên liệu trực tiếp trên Cloud
                for (let cartItem of pendingOrder.items) {
                    if (cartItem.recipe) {
                        for (let recipeItem of cartItem.recipe) {
                            const ingRef = doc(db, "inventory", recipeItem.ingId);
                            const ingSnap = await getDoc(ingRef);
                            if (ingSnap.exists()) {
                                let currentQty = ingSnap.data().quantity;
                                let newQty = Math.max(0, currentQty - (recipeItem.amount * cartItem.quantity));
                                await updateDoc(ingRef, { quantity: newQty });
                            }
                        }
                    }
                }

                // 3. Cộng dồn doanh thu cho Báo cáo
                const financeRef = doc(db, "config", "finance");
                const finSnap = await getDoc(financeRef);
                if (finSnap.exists()) {
                    await updateDoc(financeRef, { totalRevenue: finSnap.data().totalRevenue + pendingOrder.total });
                } else {
                    await setDoc(financeRef, { fixedCosts: 0, ingredientCosts: 0, totalRevenue: pendingOrder.total });
                }

                // 4. Lưu đơn hàng vào Firebase (Sẽ kích hoạt màn hình bếp ngay lập tức)
                await addDoc(collection(db, "orders"), {
                    ...pendingOrder,
                    queueNumber: queue,
                    status: 'Chờ pha chế',
                    timestamp: serverTimestamp()
                });

                localStorage.removeItem('meda_pending_order');
                alert(`Thanh toán thành công!\n\nTên: ${pendingOrder.customerName || 'Khách hàng'}\nSỐ THỨ TỰ CỦA BẠN LÀ: #${queue}\n\nVui lòng chờ quán gọi nhé!`);
                window.location.href = "index.html";

            } catch (e) {
                console.error("Lỗi xác nhận đơn:", e);
                alert("Lỗi mạng! Không thể kết nối với máy chủ. Vui lòng thử lại.");
                btn.disabled = false;
                btn.textContent = "✅ Tôi Đã Chuyển Khoản Thành Công";
            }
        }

        window.cancelOrder = function() { window.location.href = "index.html"; }
    </script>
</body>
</html>
