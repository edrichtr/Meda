<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mê Đá</title>
    <link href="logo.jpg" rel="icon" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #FBF6EE; --card-bg: #FFFDF9; --primary: #3D2B1F; --accent: #C85A32; --accent-hover: #A03C1B; --text-main: #2B1E16; --text-muted: #7A6B62; --border: #E8DFC8; --green: #2E7D32; --red: #C62828; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg-color); color: var(--text-main); line-height: 1.5; }
        
        header { background-color: var(--primary); color: #FAF4EB; padding: 2rem 2rem; text-align: center; border-bottom: 4px solid var(--accent); position: relative; display: flex; flex-direction: column; align-items: center; }
        .logo { width: 90px; height: 90px; object-fit: cover; border-radius: 50%; border: 3px solid var(--accent); margin-bottom: 12px; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3); background-color: #FFFDF9; }
        header h1 { font-family: 'Merriweather', serif; font-size: 2.2rem; letter-spacing: 1px; color: #F3E5D8; }
        header p { font-size: 0.95rem; color: #D2C2B4; font-style: italic; }
        
        /* Chỉnh lại phần nút góc phải cho gọn */
        .top-links { position: absolute; right: 1.5rem; top: 1.5rem; display: flex; flex-direction: column; gap: 8px; }
        .nav-link { color: #F3E5D8; text-decoration: none; font-size: 0.85rem; background: rgba(255,255,255,0.1); padding: 6px 14px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.2); transition: all 0.2s; font-weight: 600; text-align: center; }
        .nav-link:hover { background: var(--accent); border-color: var(--accent); }
        @media (max-width: 600px) { .top-links { position: static; flex-direction: row; margin-top: 15px; } }

        /* --- BẢNG SỰ KIỆN --- */
        #dynamicEventBanner { max-width: 1200px; margin: 1.5rem auto 0; padding: 1rem 1.5rem; border: 2px dashed var(--accent); border-radius: 12px; display: none; align-items: center; justify-content: space-between; box-shadow: 0 4px 10px rgba(200, 90, 50, 0.1); animation: pulseBanner 3s infinite; }
        @keyframes pulseBanner { 0% { box-shadow: 0 4px 10px rgba(200, 90, 50, 0.1); } 50% { box-shadow: 0 4px 20px rgba(200, 90, 50, 0.3); } 100% { box-shadow: 0 4px 10px rgba(200, 90, 50, 0.1); } }
        .event-content h3 { color: var(--red); font-family: 'Merriweather', serif; font-size: 1.3rem; margin-bottom: 0.3rem; display: flex; align-items: center; gap: 8px; }
        .event-badge { background: var(--red); color: white; padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: bold; animation: blinkText 1s infinite; }
        @keyframes blinkText { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .event-content p { font-size: 0.95rem; color: var(--primary); font-weight: 600; }

        .container { max-width: 1200px; margin: 1.5rem auto 2rem; padding: 0 1rem; display: grid; grid-template-columns: 1fr 360px; gap: 2rem; }
        @media (max-width: 900px) { .container { grid-template-columns: 1fr; } #dynamicEventBanner { flex-direction: column; text-align: center; gap: 10px; margin: 1rem 1rem 0; } }

        .menu-title { font-family: 'Merriweather', serif; font-size: 1.5rem; margin-bottom: 1.2rem; padding-bottom: 0.5rem; border-bottom: 2px dashed var(--border); color: var(--primary); }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1.5rem; }

        /* THẺ SẢN PHẨM */
        .product-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 4px 12px rgba(61, 43, 31, 0.05); transition: transform 0.2s, box-shadow 0.2s; }
        .product-card:hover { transform: translateY(-4px); box-shadow: 0 8px 20px rgba(61, 43, 31, 0.1); }
        .product-img { width: 100%; height: 180px; object-fit: cover; background-color: #EFE8DC; }
        .product-info { padding: 1.2rem 1rem; display: flex; flex-direction: column; flex-grow: 1; }
        .product-name { font-family: 'Merriweather', serif; font-size: 1.2rem; font-weight: 700; color: var(--primary); margin-bottom: 0.3rem; }
        .product-desc { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.8rem; font-style: italic; line-height: 1.4; flex-grow: 1; }
        .product-price { font-weight: 700; color: var(--accent); font-size: 1.1rem; margin-bottom: 0.5rem; }
        .stock-tag { font-size: 0.8rem; font-weight: 600; margin-bottom: 1rem; display: inline-block; }
        .stock-available { color: var(--green); }
        .stock-out { color: var(--red); font-weight: 700; }
        .btn-add { margin-top: auto; width: 100%; padding: 12px 10px; background-color: var(--primary); color: #fff; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; transition: background 0.2s; text-transform: uppercase; font-size: 0.9rem; }
        .btn-add:hover:not(:disabled) { background-color: var(--accent); }
        .btn-add:disabled { background-color: #D3C9C1; color: #8C8077; cursor: not-allowed; }

        /* GIỎ HÀNG & THÔNG TIN KHÁCH HÀNG */
        .cart-box { background: var(--card-bg); border: 2px solid var(--border); border-radius: 12px; padding: 1.5rem; height: fit-content; position: sticky; top: 1rem; box-shadow: 0 4px 15px rgba(0,0,0,0.04); }
        .cart-header { font-family: 'Merriweather', serif; font-size: 1.3rem; color: var(--primary); margin-bottom: 1rem; padding-bottom: 0.5rem; border-bottom: 2px solid var(--border); }
        .cart-items { max-height: 280px; overflow-y: auto; margin-bottom: 1rem; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 0.6rem 0; border-bottom: 1px dashed #EFE7DA; }
        .cart-item-info h4 { font-size: 0.95rem; color: var(--primary); }
        .cart-item-info span { font-size: 0.85rem; color: var(--text-muted); }
        .cart-item-qty { display: flex; align-items: center; gap: 6px; }
        .btn-qty { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--border); background: #FAF5ED; cursor: pointer; font-weight: bold; }
        
        .customer-info-box { background: #FAF5ED; padding: 15px; border-radius: 8px; margin-bottom: 1rem; border: 1px dashed var(--accent); }
        .customer-info-box label { display: block; font-size: 0.85rem; font-weight: bold; color: var(--primary); margin-top: 5px; margin-bottom: 4px; }
        .customer-info-box input, .customer-info-box select { width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 6px; border: 1px solid var(--border); font-family: inherit; font-size: 0.95rem; }
        .customer-info-box input:focus { outline: 2px solid var(--accent); border-color: transparent;}
        
        .cart-total { border-top: 2px solid var(--border); padding-top: 1rem; display: flex; justify-content: space-between; font-size: 1.2rem; font-weight: 700; color: var(--accent); margin-bottom: 1.2rem; }
        .btn-checkout { width: 100%; padding: 14px; background-color: var(--accent); color: white; border: none; border-radius: 8px; font-size: 1.05rem; font-weight: 700; cursor: pointer; box-shadow: 0 4px 10px rgba(200, 90, 50, 0.3); transition: background 0.2s; }
        .btn-checkout:hover:not(:disabled) { background-color: var(--accent-hover); }
        .btn-checkout:disabled { background-color: #D3C9C1; box-shadow: none; cursor: not-allowed; }
        .empty-cart-msg { text-align: center; color: var(--text-muted); padding: 2rem 0; font-style: italic; }
    </style>
</head>
<body>

    <header>
        <img src="logo.jpg" alt="Mê Đá Logo" class="logo" onerror="this.src='https://via.placeholder.com/90'">
        <h1>MÊ ĐÁ</h1>
        <p>Chúng tôi không bán nước, chúng tôi bán câu chuyện</p>
        
        <!-- NÚT CHUYỂN TRANG -->
        <div class="top-links">
            <a href="donhang.html" class="nav-link" style="background-color: var(--green); border-color: var(--green);">👨‍🍳 Staff</a>
            <a href="admin.html" class="nav-link">⚙️ Admin</a>
        </div>
    </header>

    <!-- BANNER SỰ KIỆN -->
    <div id="dynamicEventBanner">
        <div class="event-content">
            <h3><span id="evTitleRender">Sự Kiện</span> <span class="event-badge">HOT</span></h3>
            <p id="evDescRender">Nội dung</p>
        </div>
        <div><span style="font-size: 2rem;">🎁☕</span></div>
    </div>

    <div class="container">
        <!-- Danh sách đồ uống -->
        <div>
            <h2 class="menu-title">☕ Thực Đơn Đồ Uống</h2>
            <div id="productsGrid" class="products-grid"></div>
        </div>

        <!-- Giỏ hàng -->
        <div>
            <div class="cart-box">
                <h3 class="cart-header">🛒 Giỏ Hàng</h3>
                <div id="cartItems" class="cart-items"></div>
                
                <div class="customer-info-box" id="customerInfoBox" style="display: none;">
                    <label for="custName">Tên của bạn:</label>
                    <input type="text" id="custName" placeholder="Nhập tên của bạn" required>
                    
                    <label for="orderType">Hình thức sử dụng:</label>
                    <select id="orderType">
                        <option value="Tại chỗ">Dùng tại chỗ</option>
                        <option value="Mang về">Take away</option>
                    </select>
                </div>

                <div class="cart-total">
                    <span>Tổng tiền:</span>
                    <span id="cartTotal">0 VNĐ</span>
                </div>
                
                <button id="btnCheckout" class="btn-checkout" onclick="proceedToCheckout()" disabled>
                    Thanh Toán Qua QR
                </button>
            </div>
        </div>
    </div>

    <script>
        function loadEventBanner() {
            const config = JSON.parse(localStorage.getItem('meda_event_config'));
            const bannerEl = document.getElementById('dynamicEventBanner');
            if (config && config.isActive) {
                document.getElementById('evTitleRender').textContent = config.title || 'Sự Kiện';
                document.getElementById('evDescRender').textContent = config.desc || '';
                bannerEl.style.backgroundColor = config.bgColor || '#FFEBE6';
                bannerEl.style.display = 'flex';
            } else { bannerEl.style.display = 'none'; }
        }

        let cart = [];

        function getInventory() { return JSON.parse(localStorage.getItem('meda_inventory')) || []; }
        function getProducts() { return JSON.parse(localStorage.getItem('meda_products')) || []; }

        function calculateMaxCups(product, inventory) {
            if (!product.recipe || product.recipe.length === 0) return 999;
            let maxCups = Infinity;
            for (const item of product.recipe) {
                const ing = inventory.find(i => i.id === item.ingId);
                if (!ing || ing.quantity < item.amount) return 0;
                const possible = Math.floor(ing.quantity / item.amount);
                if (possible < maxCups) maxCups = possible;
            }
            return maxCups === Infinity ? 0 : maxCups;
        }

        function renderMenu() {
            const products = getProducts();
            const inventory = getInventory();
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';

            products.forEach(p => {
                const maxCups = calculateMaxCups(p, inventory);
                const inCart = cart.find(ci => ci.id === p.id);
                const cartQty = inCart ? inCart.quantity : 0;
                const availableCups = maxCups - cartQty;
                const isOut = availableCups <= 0;
                const descText = p.description ? p.description : 'Một thức uống tuyệt vời tại Mê Đá.';

                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <img src="${p.image}" class="product-img" alt="${p.name}" onerror="this.src='https://via.placeholder.com/300x200?text=Me+Da+Coffee'">
                    <div class="product-info">
                        <div class="product-name">${p.name}</div>
                        <div class="product-desc">"${descText}"</div>
                        <div class="product-price">${p.price.toLocaleString('vi-VN')} VNĐ</div>
                        <div class="stock-tag ${isOut ? 'stock-out' : 'stock-available'}">
                            ${isOut ? '❌ Hết nguyên liệu' : `✔ Có thể pha: ${availableCups} ly`}
                        </div>
                        <button class="btn-add" ${isOut ? 'disabled' : ''} onclick="addToCart('${p.id}')">
                            ${isOut ? 'Tạm Hết Món' : 'Thêm Vào Giỏ'}
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function addToCart(productId) {
            const products = getProducts();
            const product = products.find(p => p.id === productId);
            if (!product) return;

            const existing = cart.find(item => item.id === productId);
            if (existing) { existing.quantity++; } else { cart.push({ ...product, quantity: 1 }); }
            updateCartUI(); renderMenu();
        }

        function changeQuantity(productId, delta) {
            const item = cart.find(i => i.id === productId);
            if (!item) return;
            item.quantity += delta;
            if (item.quantity <= 0) cart = cart.filter(i => i.id !== productId);
            updateCartUI(); renderMenu();
        }

        function updateCartUI() {
            const container = document.getElementById('cartItems');
            const totalEl = document.getElementById('cartTotal');
            const btnCheckout = document.getElementById('btnCheckout');
            const infoBox = document.getElementById('customerInfoBox');

            if (cart.length === 0) {
                container.innerHTML = '<div class="empty-cart-msg">Giỏ hàng đang trống</div>';
                totalEl.textContent = '0 VNĐ'; 
                btnCheckout.disabled = true; 
                infoBox.style.display = 'none'; 
                return;
            }

            container.innerHTML = '';
            let total = 0;

            cart.forEach(item => {
                const itemTotal = item.price * item.quantity;
                total += itemTotal;
                container.innerHTML += `
                    <div class="cart-item">
                        <div class="cart-item-info">
                            <h4>${item.name}</h4><span>${item.price.toLocaleString('vi-VN')} VNĐ x ${item.quantity}</span>
                        </div>
                        <div class="cart-item-qty">
                            <button class="btn-qty" onclick="changeQuantity('${item.id}', -1)">-</button>
                            <span>${item.quantity}</span>
                            <button class="btn-qty" onclick="changeQuantity('${item.id}', 1)">+</button>
                        </div>
                    </div>
                `;
            });

            totalEl.textContent = total.toLocaleString('vi-VN') + ' VNĐ';
            btnCheckout.disabled = false;
            infoBox.style.display = 'block';
        }

        function proceedToCheckout() {
            if (cart.length === 0) return;
            
            const custNameInput = document.getElementById('custName');
            const custName = custNameInput.value.trim();
            const orderType = document.getElementById('orderType').value;

            if (!custName) {
                alert("Vui lòng nhập tên của bạn để quán dễ dàng gọi khi nước pha xong nhé!");
                custNameInput.focus();
                return;
            }

            const pendingOrder = {
                orderId: 'MD' + Math.floor(100000 + Math.random() * 900000),
                customerName: custName,
                orderType: orderType,
                items: cart,
                total: cart.reduce((sum, i) => sum + i.price * i.quantity, 0),
                createdAt: new Date().toLocaleString('vi-VN')
            };
            
            localStorage.setItem('meda_pending_order', JSON.stringify(pendingOrder));
            window.location.href = 'checkout.html';
        }

        window.addEventListener('pageshow', () => {
            loadEventBanner(); renderMenu(); updateCartUI();
        });
    </script>
</body>
</html>
